    <h2 id="so-far">What we learned so far</h2>
    <p>Jev's confidence is useful on familiar ground and unreliable beyond it, and correcting the number afterwards
      doesn't help. In <a href="part-2.html">Part 2</a> we ask Jev directly whether it knows, test what that question
      reacts to, and look at the questions that did hold up.</p>
