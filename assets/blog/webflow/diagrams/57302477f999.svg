<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" viewBox="0 0 720 262" role="img"
            aria-label="Pipeline diagram of the first stage: 2,270 real test messages; category names hidden behind codes reshuffled per message; nine knowledge settings; each asked three times, about 61,300 calls; confidence compared with accuracy in every setting. The same messages also go to a five-student ensemble and to an open rival model, and everything is compared message by message.">
            <defs>
              <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
                orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" style="fill:#6e6c67" />
              </marker>
            </defs>
            <g font-size="11.5" style="fill:#0b0b0b">
              <g>
                <rect x="4" y="16" width="128" height="92" rx="10" style="fill:#f9f9f7;stroke:#c3c2b7" />
                <text x="68" y="40" text-anchor="middle" font-weight="700" font-size="12">2,270 real</text>
                <text x="68" y="56" text-anchor="middle" font-weight="700" font-size="12">test messages</text>
                <text x="68" y="76" text-anchor="middle" style="fill:#52514e">770 banking ·</text>
                <text x="68" y="92" text-anchor="middle" style="fill:#52514e">1,500 assistant</text>
              </g>
              <line x1="134" y1="62" x2="148" y2="62" style="stroke:#6e6c67" stroke-width="1.5"
                marker-end="url(#ah3)" />
              <g>
                <rect x="150" y="16" width="128" height="92" rx="10" style="fill:#f9f9f7;stroke:#c3c2b7" />
                <text x="214" y="40" text-anchor="middle" font-weight="700" font-size="12">Hide every</text>
                <text x="214" y="56" text-anchor="middle" font-weight="700" font-size="12">category name</text>
                <text x="214" y="76" text-anchor="middle" style="fill:#52514e">behind a code,</text>
                <text x="214" y="92" text-anchor="middle" style="fill:#52514e">reshuffled each time</text>
              </g>
              <line x1="280" y1="62" x2="294" y2="62" style="stroke:#6e6c67" stroke-width="1.5"
                marker-end="url(#ah3)" />
              <g>
                <rect x="296" y="16" width="128" height="92" rx="10" style="fill:#f9f9f7;stroke:#2a78d6"
                  stroke-width="1.5" />
                <text x="360" y="40" text-anchor="middle" font-weight="700" font-size="12">Turn the</text>
                <text x="360" y="56" text-anchor="middle" font-weight="700" font-size="12">knowledge dial</text>
                <text x="360" y="76" text-anchor="middle" style="fill:#52514e">0 → 8 examples,</text>
                <text x="360" y="92" text-anchor="middle" style="fill:#52514e">names, 2 trick tests</text>
              </g>
              <line x1="426" y1="62" x2="440" y2="62" style="stroke:#6e6c67" stroke-width="1.5"
                marker-end="url(#ah3)" />
              <g>
                <rect x="442" y="16" width="128" height="92" rx="10" style="fill:#f9f9f7;stroke:#c3c2b7" />
                <text x="506" y="40" text-anchor="middle" font-weight="700" font-size="12">Ask Jev</text>
                <text x="506" y="56" text-anchor="middle" font-weight="700" font-size="12">3 times each</text>
                <text x="506" y="76" text-anchor="middle" style="fill:#52514e">≈61,300 calls,</text>
                <text x="506" y="92" text-anchor="middle" style="fill:#52514e">averaged</text>
              </g>
              <line x1="572" y1="62" x2="586" y2="62" style="stroke:#6e6c67" stroke-width="1.5"
                marker-end="url(#ah3)" />
              <g>
                <rect x="588" y="16" width="128" height="92" rx="10" style="fill:#f1f0ec;stroke:#c3c2b7" />
                <text x="652" y="40" text-anchor="middle" font-weight="700" font-size="12">Compare</text>
                <text x="652" y="56" text-anchor="middle" font-weight="700" font-size="12">confidence</text>
                <text x="652" y="76" text-anchor="middle" style="fill:#52514e">with accuracy,</text>
                <text x="652" y="92" text-anchor="middle" style="fill:#52514e">setting by setting</text>
              </g>
              <path d="M68,110 L68,200 L146,200" fill="none" style="stroke:#6e6c67" stroke-width="1.5"
                marker-end="url(#ah3)" />
              <rect x="150" y="140" width="566" height="116" rx="12" style="fill:none;stroke:#c3c2b7"
                stroke-dasharray="4 4" />
              <text x="166" y="160" font-size="10.5" font-weight="700" letter-spacing="0.06em"
                style="fill:#52514e">SECOND OPINIONS · SAME MESSAGES</text>
              <rect x="166" y="172" width="200" height="60" rx="10" style="fill:#f9f9f7;stroke:#d4561f"
                stroke-width="1.5" />
              <text x="266" y="196" text-anchor="middle" font-weight="700" font-size="12">Five "students"</text>
              <text x="266" y="214" text-anchor="middle" style="fill:#52514e">whose doubt we can measure</text>
              <rect x="380" y="172" width="200" height="60" rx="10" style="fill:#f9f9f7;stroke:#0e8a5f"
                stroke-width="1.5" />
              <text x="480" y="196" text-anchor="middle" font-weight="700" font-size="12">An open rival model</text>
              <text x="480" y="214" text-anchor="middle" style="fill:#52514e">same messages, same codes</text>
              <line x1="652" y1="140" x2="652" y2="112" style="stroke:#6e6c67" stroke-width="1.5"
                marker-end="url(#ah3)" />
              <text x="648" y="196" text-anchor="middle" style="fill:#52514e">compared,</text>
              <text x="648" y="212" text-anchor="middle" style="fill:#52514e">message by</text>
              <text x="648" y="228" text-anchor="middle" style="fill:#52514e">message</text>
            </g>
          </svg>
