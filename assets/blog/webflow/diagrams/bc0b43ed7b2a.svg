<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" viewBox="0 0 720 330" role="img"
          aria-label="Diagram: a confidence gate in production. A message goes to Jev, which returns probabilities. If confidence is above the threshold the system acts automatically, otherwise it sends the message to a person. A model that knows and is sure is automated correctly. A model that has no idea but sounds sure passes the gate and causes a wrong action that no one reviews.">
          <defs>
            <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
              orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" style="fill:#6e6c67" />
            </marker>
            <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
              orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" style="fill:#006300" />
            </marker>
            <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
              orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" style="fill:#b3261e" />
            </marker>
          </defs>
          <g font-size="12.5" style="fill:#0b0b0b">
            <rect x="8" y="58" width="140" height="70" rx="10" style="fill:#f9f9f7;stroke:#c3c2b7" />
            <text x="78" y="86" text-anchor="middle" font-weight="650">Customer message</text>
            <text x="78" y="106" text-anchor="middle" font-size="11" style="fill:#52514e">"my card hasn't
              arrived"</text>
            <line x1="150" y1="93" x2="182" y2="93" style="stroke:#6e6c67" stroke-width="1.5"
              marker-end="url(#ah)" />
            <rect x="186" y="58" width="164" height="70" rx="10" style="fill:#f9f9f7;stroke:#2a78d6"
              stroke-width="1.5" />
            <text x="268" y="86" text-anchor="middle" font-weight="650">Jev</text>
            <text x="268" y="106" text-anchor="middle" font-size="11" style="fill:#52514e">probabilities for all
              options</text>
            <line x1="352" y1="93" x2="378" y2="93" style="stroke:#6e6c67" stroke-width="1.5"
              marker-end="url(#ah)" />
            <rect x="382" y="50" width="142" height="86" rx="18" style="fill:#f1f0ec;stroke:#c3c2b7" />
            <text x="453" y="84" text-anchor="middle" font-weight="650">Confidence above</text>
            <text x="453" y="102" text-anchor="middle" font-weight="650">your threshold?</text>
            <path d="M526,78 C548,78 548,40 572,40" fill="none" style="stroke:#6e6c67" stroke-width="1.5"
              marker-end="url(#ah)" />
            <text x="536" y="52" font-size="11" style="fill:#52514e">yes</text>
            <path d="M526,108 C548,108 548,146 572,146" fill="none" style="stroke:#6e6c67" stroke-width="1.5"
              marker-end="url(#ah)" />
            <text x="536" y="140" font-size="11" style="fill:#52514e">no</text>
            <rect x="576" y="16" width="138" height="48" rx="10" style="fill:#f9f9f7;stroke:#c3c2b7" />
            <text x="645" y="45" text-anchor="middle" font-weight="650">Act automatically</text>
            <rect x="576" y="122" width="138" height="48" rx="10" style="fill:#f9f9f7;stroke:#c3c2b7" />
            <text x="645" y="151" text-anchor="middle" font-weight="650">Send to a person</text>
            <line x1="8" y1="200" x2="712" y2="200" style="stroke:#e1e0d9" />
            <text x="8" y="226" font-size="11" font-weight="700" letter-spacing="0.06em" style="fill:#52514e">TWO
              MODELS WALK UP TO THE GATE…</text>
            <circle cx="18" cy="257" r="9" style="fill:#006300" /><text x="18" y="261" text-anchor="middle"
              font-size="11" font-weight="800" style="fill:#fcfcfb">✓</text>
            <text x="36" y="261" font-weight="650">Knows the answer, and is sure</text>
            <line x1="262" y1="257" x2="476" y2="257" style="stroke:#006300" stroke-width="2"
              marker-end="url(#ahg)" />
            <text x="486" y="261" style="fill:#006300" font-weight="650">Automated, correctly</text>
            <circle cx="18" cy="302" r="9" style="fill:#b3261e" /><text x="18" y="306" text-anchor="middle"
              font-size="11" font-weight="800" style="fill:#fcfcfb">✗</text>
            <text x="36" y="306" font-weight="650">Has no idea, but sounds sure</text>
            <line x1="262" y1="302" x2="476" y2="302" style="stroke:#b3261e" stroke-width="2" stroke-dasharray="6 4"
              marker-end="url(#ahb)" />
            <text x="486" y="306" style="fill:#b3261e" font-weight="650">Wrong, and nobody is asked</text>
          </g>
        </svg>
